services:
  - type: web
    name: requirements-analysis-system
    env: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --only-binary=:all: --no-compile --force-reinstall -r requirements.txt
      python -c "import spacy; print('SpaCy installed successfully')" || echo "SpaCy will be handled at runtime"
      python -m spacy download en_core_web_sm --quiet || echo "Model will download at runtime"
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_MODE
        value: true
      - key: EXPORT_FORMAT
        value: json
      - key: API_HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false
      - key: RESEARCH_DATA_PATH
        value: ./research_data
      - key: AUTO_SAVE
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: app.log
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PIP_ONLY_BINARY
        value: ":all:"
