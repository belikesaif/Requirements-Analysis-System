services:
  - type: web
    name: requirements-analysis-system
    env: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --only-binary=:all: --no-compile -r requirements.txt
      python -c "import fastapi, uvicorn, numpy; print('Core packages OK')"
      echo "🔧 Installing spaCy model (build time)..."
      python -m spacy download en_core_web_sm || pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl || echo "Warning: SpaCy model installation failed during build"
      echo "✅ Build completed"
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_MODE
        value: true
      - key: EXPORT_FORMAT
        value: json
      - key: API_HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        value: https://nrasfrontend.vercel.app
      - key: RESEARCH_DATA_PATH
        value: ./research_data
      - key: AUTO_SAVE
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: app.log
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PIP_ONLY_BINARY
        value: ":all:"
