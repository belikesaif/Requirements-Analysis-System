services:
  - type: web
    name: nlp-requirements-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_MODE
        value: true
      - key: EXPORT_FORMAT
        value: json
      - key: API_HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false
      - key: RESEARCH_DATA_PATH
        value: ./research_data
      - key: AUTO_SAVE
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: app.log
