services:
  - type: web
    name: requirements-analysis-system
    env: python
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install --no-cache-dir -r requirements.txt
      python -m spacy download en_core_web_sm --quiet || echo "SpaCy model download will happen at runtime"
    startCommand: ./start.sh
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEARCH_MODE
        value: true
      - key: EXPORT_FORMAT
        value: json
      - key: API_HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false
      - key: RESEARCH_DATA_PATH
        value: ./research_data
      - key: AUTO_SAVE
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FILE
        value: app.log
      - key: PYTHONPATH
        value: /opt/render/project/src
